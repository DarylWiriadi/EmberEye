[project]
name = "embereye-pipeline"
version = "0.1.0"
description = "Offline FIRMS MODIS + VIIRS harmonization pipeline for EmberEye"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "pyarrow>=20",
    "boto3>=1.34",
    "numpy>=2",
    "h5py>=3.11",   # MERRA-2 (NetCDF-4)
    "scipy>=1.14",  # GFWED (NetCDF-3)
    "pyhdf>=0.11",  # MODIS land cover (HDF4)
    "pyshp>=2.3",   # Natural Earth roads (shapefile)
]
